[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-apex"
version = "0.1.0"
description = "Research-first quantitative trading platform for Deriv"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["project_apex"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["project_apex/tests"]
asyncio_mode = "auto"