application:
  name: Project APEX
  version: 0.1.0
  environment: development

database:
  type: sqlite
  path: datasets/database.db

logging:
  level: INFO
  file: logs/apex.log

market:
  symbols:
    - R_25
  timeframes:
    - 60
    - 300
    - 900
  stats_interval: 60
  contract: rise_fall

risk:
  risk_per_trade: 0.01
  max_daily_loss: 0.05
  max_consecutive_losses: 3

api:
  app_id: ""
  websocket_url: "wss://ws.binaryws.com/websockets/v3"
  heartbeat_interval: 30
  heartbeat_timeout: 10
  reconnect_max_attempts: 10
  reconnect_initial_delay: 1.0
  reconnect_max_delay: 60.0
